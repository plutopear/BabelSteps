# CodeQL code scanning. Free only on public repositories, so every job is
# skipped while the repository is private and starts once it is public.
name: CodeQL

on:
  pull_request:
    # Notes and research files contain no code to scan.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "research/**"
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  # Never cancel a run on main: a quick second merge used to cancel the
  # first merge's checks, so that commit was never fully tested.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    # Dependabot pull requests only change lock files, which cargo-deny and
    # npm audit already check; the push to main after the merge is scanned.
    # Skipping them keeps the free Linux runners from queueing.
    if: ${{ !github.event.repository.private && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
