# Security checks. Linux runners only, so they cost few Actions minutes.
# Also runs weekly, because new vulnerabilities are published for code that
# has not changed.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: Rust dependencies - vulnerabilities, licences, banned crates, sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  npm-audit:
    name: npm packages - known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Fails on high or critical. Low and moderate findings show in the log
      # and arrive as Dependabot pull requests.
      - name: npm audit
        working-directory: app
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan (whole history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The action lists a pull request's commits to scan just those.
      pull-requests: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Free for personal accounts; no licence key needed.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Free only on public repositories. Skipped while the repository is
  # private, and turns itself on when it goes public.
  dependency-review:
    name: New dependencies - vulnerabilities and licences
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
