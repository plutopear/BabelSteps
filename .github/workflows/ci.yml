# Privacy and test checks (docs/07-definition-of-done.md, row 3.4).
# Runs on every pull request and every push to main. Nothing here uploads
# recordings or results anywhere; the jobs only build and test the code.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: a quick second merge used to cancel the
  # first merge's checks, so that commit was never fully tested.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows - tests, golden files, no-network check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the frontend
        working-directory: app
        run: |
          npm ci
          npm run build
      # Unit tests, the golden-file export tests, and the privacy scans in checks/.
      - name: Tests
        run: cargo test --workspace --locked
      # Networking crates, Tauri plugins, tokio's net feature, capabilities.
      - name: No-network dependency check
        shell: powershell
        run: powershell -NoProfile -File .claude/skills/babelsteps-check/scripts/no-network.ps1

  linux-runtime:
    name: Linux - runtime socket test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install strace
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Runtime socket test
        run: scripts/ci/no-socket-at-runtime.sh
