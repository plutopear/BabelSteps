# Automatic dependency updates. Free on private and public repositories.
# Each update is a pull request, so CI (tests, privacy checks, cargo-deny)
# runs on it before anything reaches main. An update that pulls in a
# networking crate fails those checks and must not be merged.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # One PR for all minor and patch updates keeps Windows CI minutes low.
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      # A different day from cargo, so their pull requests (each runs three
      # workflows) don't all start CI at the same moment.
      day: tuesday
    open-pull-requests-limit: 3
    ignore:
      # svelte-check only accepts TypeScript 5 or 6, so `npm ci` fails on 7.
      # Remove this when svelte-check supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
      # vite 8 needs vite-plugin-svelte 7 (and the reverse), so a separate
      # pull request for each fails npm ci. Update them together.
      vite-toolchain:
        patterns: ["vite", "@sveltejs/vite-plugin-svelte"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
