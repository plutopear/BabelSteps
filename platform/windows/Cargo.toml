[package]
name = "babelsteps-windows"
description = "BabelSteps Windows capture backend: input hooks, before-the-click screenshots, UI Automation, password redaction"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
anyhow = "1"
babelsteps-core = { path = "../../core" }
crossbeam-channel = "0.5"

[features]
# Fault injection and the `capture-selftest` binary. Never enabled in a release build.
selftest = []

[[bin]]
name = "capture-selftest"
path = "src/bin/capture_selftest.rs"
required-features = ["selftest"]

[[bin]]
name = "browser-selftest"
path = "src/bin/browser_selftest.rs"
required-features = ["selftest"]

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Wdk_System_SystemServices",
]
